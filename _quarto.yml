project:
  type: website
  output-dir: _site
  pre-render: pre-render.R
  post-render: post-render.R
  # Standalone interactive pages (not .qmd) that Quarto must copy to _site.
  resources:
    - "widgets/*.html"
    - "lectures/153-Article Text-1038-1-10-20191126.pdf"
  # Every course page is a .qmd. Listing them explicitly keeps maintainer
  # notes like commands.md off the student site -- Quarto auto-ignores
  # README.md and anything starting with "_", but not other .md files.
  render:
    - "**/*.qmd"
    - "!rlabs/w03_sem.qmd"  # WIP draft -- excluded from render for now
    - "!lectures/w05_interpretation.qmd"  # WIP draft -- excluded from render for now

# Re-execute a deck only when its own source changes. Caveat: freeze does not
# notice edits to files a deck source()s (e.g. lectures/w12_models.R); delete
# _freeze/lectures/w12_* and _freeze/lectures/w13_* after changing it.
execute:
  freeze: auto

profile:
  default: student

website:
  title: "EDEP 625 Structural Equation Modeling"
  navbar:
    left:
      - href: syllabus.qmd
        text: Syllabus
      - href: lectures.qmd
        text: Lectures
      - href: labs.qmd
        text: R Labs
      - href: widgets.qmd
        text: Activity
      - href: methods_walk_through.qmd
        text: Methods Walk Through
      - href: fin_proj.qmd
        text: Mini Projects
  

format:
  html:
    theme: darkly
    toc: true
    # View Source would embed the raw .qmd, including teacher-only answer blocks.
    code-tools:
      source: false
