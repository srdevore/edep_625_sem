project:
  type: website
  output-dir: _site
  pre-render: pre-render.R
  post-render: post-render.R
  # Every course page is a .qmd. Listing them explicitly keeps maintainer
  # notes like commands.md off the student site -- Quarto auto-ignores
  # README.md and anything starting with "_", but not other .md files.
  render:
    - "**/*.qmd"
    - "!rlabs/w03_sem.qmd"  # WIP draft -- excluded from render for now
    - "!rlabs/w05_interpretation.qmd"  # WIP draft -- excluded from render for now
    - "!lectures/w05_interpretation.qmd"  # WIP draft -- excluded from render for now

profile:
  default: student

website:
  title: "EDEP 625 Structural Equation Modeling"
  navbar:
    left:
      - href: syllabus.qmd
        text: Syllabus
      - href: lectures.qmd
        text: Lectures
      - href: labs.qmd
        text: R Labs
      - href: methods_walk_through.qmd
        text: Methods Walk Through
      - href: fin_proj.qmd
        text: Mini Projects
  

format:
  html:
    theme: darkly
    toc: true
    code-tools: true
